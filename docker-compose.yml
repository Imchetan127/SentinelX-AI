version: '3.8'

# ==============================================================================
# SentinelX AI Platform — Production Docker Compose Orchestration
# Single-Command Deployment Stack for Red Team vs Blue Team Security Framework
# ==============================================================================

services:
  # ── 1. PostgreSQL Database Service ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelx_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sentinelx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. FastAPI Backend Service ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/sentinelx_db}
      JWT_SECRET: ${JWT_SECRET:-production_super_secret_jwt_key_sentinelx_2026}
      MODEL_DIR: ${MODEL_DIR:-/app/models}
      DATASETS_DIR: ${DATASETS_DIR:-/app/datasets}
      REPORTS_DIR: ${REPORTS_DIR:-/app/reports}
      LOGS_DIR: ${LOGS_DIR:-/app/logs}
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models
      - datasets:/app/datasets
      - reports:/app/reports
      - logs:/app/logs
    networks:
      - sentinel-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 3. Next.js Frontend Service ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    networks:
      - sentinel-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 4. Adminer Database GUI (Optional Dev Profile) ──────────────────────────
  adminer:
    image: adminer:latest
    container_name: sentinel-adminer
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "8080:8080"
    networks:
      - sentinel-network
    depends_on:
      - postgres

# ── Networks & Persistent Volumes ─────────────────────────────────────────────
networks:
  sentinel-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  models:
    driver: local
  datasets:
    driver: local
  reports:
    driver: local
  logs:
    driver: local
